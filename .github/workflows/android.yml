name: Build OLUNAA Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK components
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLUNAA-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLUNAA-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.4.${{ github.run_number }}"
          name: "OLUNAA v1.4.${{ github.run_number }}"
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/debug/app-debug.apk
