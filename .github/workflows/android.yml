name: Build OLUNAA Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Read Android version
        id: android-version
        run: |
          VERSION=$(grep -o 'versionName = "[^"]*"' android/app/build.gradle.kts | cut -d '"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Accept Android licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - name: Install Android SDK components
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v6
      - name: Decode production signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OLUNAA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing OLUNAA_RELEASE_KEYSTORE_BASE64 repository secret" >&2; exit 1)
          mkdir -p android/app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          test -s android/app/release-keystore.jks
      - name: Build production-signed release APK
        working-directory: android
        env:
          OLUNAA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.OLUNAA_RELEASE_KEYSTORE_PASSWORD }}
          OLUNAA_RELEASE_KEY_ALIAS: ${{ secrets.OLUNAA_RELEASE_KEY_ALIAS }}
          OLUNAA_RELEASE_KEY_PASSWORD: ${{ secrets.OLUNAA_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$OLUNAA_RELEASE_KEYSTORE_PASSWORD" || (echo "Missing OLUNAA_RELEASE_KEYSTORE_PASSWORD secret" >&2; exit 1)
          test -n "$OLUNAA_RELEASE_KEY_ALIAS" || (echo "Missing OLUNAA_RELEASE_KEY_ALIAS secret" >&2; exit 1)
          test -n "$OLUNAA_RELEASE_KEY_PASSWORD" || (echo "Missing OLUNAA_RELEASE_KEY_PASSWORD secret" >&2; exit 1)
          gradle assembleRelease
      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          ${ANDROID_HOME}/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OLUNAA-production-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.android-version.outputs.version }}-build${{ github.run_number }}"
          name: "OLUNAA ${{ steps.android-version.outputs.version }} (build ${{ github.run_number }})"
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/app-release.apk
