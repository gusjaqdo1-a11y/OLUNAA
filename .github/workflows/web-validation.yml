name: OLUNAA Web Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/olunaa-nextgen-liquid-refresh

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/olunaa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: TypeScript validation
        run: npx tsc --noEmit
